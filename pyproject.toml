# uv workspace: the trainer (train/) and the Python client (client/python/).
[tool.uv.workspace]
members = ["client/python", "train"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.8",
    "tract>=0.22,<0.23",  # the Rust SDK (ort-tract 0.2)'s runtime: exports must load in it
]

[tool.pytest.ini_options]
testpaths = ["client/python/tests", "train/tests"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["livekit"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

# Third-party packages without type stubs / py.typed markers.
[[tool.mypy.overrides]]
module = [
    "ai_edge_litert",
    "ai_edge_litert.*",
    "livekit_wakeword_bench",
    "livekit_wakeword_bench.*",
    "onnx2tf",
    "onnxsim",
    "onnxruntime",
    "onnxruntime.*",
    "pronouncing",
    "pyarrow",
    "pyarrow.*",
    "pyaudio",
    "soundfile",
    "soxr",
    "tensorflow",
    "librosa",
    "torchaudio",
    "torchaudio.*",
    "yaml",
]
ignore_missing_imports = true
