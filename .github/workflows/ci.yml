name: CI
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv python install 3.12
      - run: uv sync --all-packages --frozen
      - run: uv run --no-sync ruff check . && uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy -p livekit.wakeword -p livekit.wakeword_train
      - run: uv run --no-sync pytest --tb=short -q

  # onnxruntime's arm64 kernels differ from x86 (KleidiAI); run the client on Apple silicon too, and the Swift package.
  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv python install 3.12
      # the client alone (numpy + onnxruntime); the dev group lives on the workspace root
      - run: uv sync --package livekit-wakeword --frozen && uv pip install pytest pytest-asyncio
      - run: uv run --no-sync pytest client/python/tests --tb=short -q
      - run: swift test
