name: Bug Report
description: File a bug report.
labels: [triage]
body:
  - type: input
    id: version
    validations: { required: true }
    attributes:
      label: Version
      description: What version of livekit-wakeword are you using?
      placeholder: "v0.3.0"
  - type: input
    id: platforms
    validations: { required: true }
    attributes:
      label: Affected Platforms
      description: What platforms, versions, and CPU architectures have you observed the issue on?
      placeholder: "macOS v15.5 (aarch64), Python 3.12"
  - type: textarea
    id: description
    validations: { required: true }
    attributes:
      label: Issue Description
      description: |
        Please describe the issue, providing steps to reproduce and any other relevant information
        (the command or code you ran, your config, the model, and the full error output).
  - type: upload
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain the issue.
    validations:
      required: false
