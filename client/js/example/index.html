<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LiveKit Wakeword</title>
    <meta name="description" content="Wake word detection in your browser, with @livekit/wakeword." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%23070707'/%3E%3Cpath fill='%231FD5F9' d='M14.4 9.6H9.6v4.8h4.8zM19.2 4.8h-4.8v4.8h4.8zM19.2 14.4h-4.8v4.8h4.8zM24 0h-4.8v4.8H24zM24 19.2h-4.8V24H24zM4.8 19.2V0H0v24h14.4v-4.8z'/%3E%3C/svg%3E" />
    <style>
      :root {
        --bg1: #070707;
        --bg2: #131313;
        --fg0: #ffffff;
        --fg1: #cccccc;
        --fg3: #999999;
        --fg4: #666666;
        --accent: #1fd5f9;
        --accent-deep: #0489a4;
        --accent-fill: #051518;
        --separator1: #202020;
        --separator2: #30302f;
        --separator-accent: #035c6d;
        --serious: #ff7566;
        --sans: 'Public Sans Variable', ui-sans-serif, system-ui, sans-serif;
        --mono: 'Commit Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body {
        display: grid;
        grid-template-rows: 1fr auto;
        min-height: 100dvh;
        background: var(--bg1);
        color: var(--fg1);
        font: 400 16px/1.5 var(--sans);
        letter-spacing: 0.01em;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }
      /* the grid floor of LiveKit's product art, fading out from the center */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: -1;
        background:
          linear-gradient(var(--separator1) 1px, transparent 1px) 50% 50% / 64px 64px,
          linear-gradient(90deg, var(--separator1) 1px, transparent 1px) 50% 50% / 64px 64px;
        mask-image: radial-gradient(ellipse 55% 50% at 50% 50%, rgb(0 0 0 / 0.6), transparent 100%);
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        height: 32px;
        padding: 0 12px;
        border: 1px solid var(--separator1);
        border-radius: 999px;
        background: var(--bg2);
        color: var(--fg0);
        text-decoration: none;
        transition: border-color 150ms ease-out;
      }
      .brand:hover { border-color: var(--separator2); }
      .brand svg { width: 14px; height: 14px; }
      .brand .gh { color: var(--fg4); transition: color 150ms ease-out; }
      .brand:hover .gh { color: var(--fg0); }
      .eyebrow {
        font: 400 12px/1 var(--mono);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--fg3);
      }
      :focus-visible { outline: none; box-shadow: 0 0 0 1px var(--bg1), 0 0 0 2px var(--accent); }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(24px, 4vh, 40px);
        padding: 48px 16px 0;
        text-align: center;
      }
      h1 {
        margin: 0;
        font: 300 clamp(32px, 6vw, 64px) / 1.05 var(--sans);
        letter-spacing: -0.03em;
        color: var(--fg4);
        text-wrap: balance;
      }
      h1 em { font-style: normal; color: var(--fg0); transition: color 300ms ease-out, text-shadow 300ms ease-out; }
      h1.hit em { color: var(--accent); text-shadow: 0 0 24px rgb(31 213 249 / 0.6); }

      .stage { position: relative; width: min(960px, 100%); height: clamp(160px, 32vh, 320px); }
      .stage::before {
        content: '';
        position: absolute;
        inset: -20% -10%;
        background: radial-gradient(closest-side, rgb(31 213 249 / 0.14), transparent);
        opacity: 0;
        transition: opacity 600ms ease-out;
        pointer-events: none;
      }
      .stage.hit::before { opacity: 1; transition-duration: 100ms; }
      .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
      .stage .drop {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        border: 1px dashed var(--separator-accent);
        border-radius: 8px;
        background: rgb(5 21 24 / 0.9);
        color: var(--accent);
        opacity: 0;
        pointer-events: none;
        transition: opacity 150ms ease-out;
      }
      body.dragging .stage .drop { opacity: 1; }

      .models { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
      .chip, .add {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 32px;
        padding: 0 10px;
        border: 1px solid var(--separator1);
        border-radius: 4px;
        background: var(--bg2);
        font: 400 12px/1 var(--mono);
        color: var(--fg1);
        transition: border-color 300ms ease-out, box-shadow 300ms ease-out, color 150ms ease-out;
      }
      .add {
        gap: 4px;
        padding: 0 10px 0 6px;
        border-style: dashed;
        border-color: var(--separator2);
        background: none;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--fg3);
        cursor: pointer;
      }
      .add:hover { color: var(--accent); border-color: var(--separator-accent); }
      .add svg { width: 18px; height: 18px; }
      .chip i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
      .chip output { min-width: 3.2ch; color: var(--fg4); font-variant-numeric: tabular-nums; text-align: right; }
      .chip.hot { border-color: color-mix(in srgb, var(--c) 50%, transparent); box-shadow: 0 0 16px color-mix(in srgb, var(--c) 25%, transparent); }
      .chip.hot output { color: var(--c); }
      .chip b {
        padding-left: 8px;
        border-left: 1px solid var(--separator2);
        font-weight: 400;
        color: var(--c);
        font-variant-numeric: tabular-nums;
      }
      .chip b:empty { display: none; }
      .chip button {
        display: grid;
        place-items: center;
        padding: 0;
        border: 0;
        background: none;
        color: var(--fg4);
        cursor: pointer;
        transition: color 150ms ease-out;
      }
      .chip button:hover { color: var(--fg0); }
      .chip button svg { width: 14px; height: 14px; }

      .controls { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 24px 16px 32px; }
      #start {
        --level: 0;
        position: relative;
        width: 72px;
        height: 72px;
        border: 1px solid var(--separator2);
        border-radius: 50%;
        background: var(--bg2);
        color: var(--fg1);
        cursor: pointer;
        display: grid;
        place-items: center;
        transition: background 300ms ease-out, box-shadow 300ms ease-out, color 150ms ease-out, transform 150ms ease-out;
      }
      #start:hover { color: var(--fg0); border-color: var(--fg4); }
      #start:active { transform: scale(0.98); }
      #start:disabled { opacity: 0.6; cursor: not-allowed; }
      #start svg { width: 26px; height: 26px; position: relative; }
      #start::before {
        content: '';
        position: absolute;
        inset: -1px;
        border-radius: 50%;
        box-shadow: 0 0 0 calc(var(--level) * 28px) rgb(31 213 249 / 0.12);
        transition: box-shadow 80ms linear;
      }
      #start.on {
        border-color: transparent;
        background: radial-gradient(circle, var(--accent) 0%, var(--accent-deep) 62%, var(--accent-fill) 100%);
        box-shadow: 0 0 32px rgb(31 213 249 / 0.35);
        color: #000;
      }
      #status { min-height: 12px; color: var(--fg4); }
      #status.error { color: var(--serious); letter-spacing: 0.02em; text-transform: none; }
      .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
      @media (prefers-reduced-motion: reduce) {
        h1 em, .stage::before, .chip, #start, #start::before { transition: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <a class="brand" href="https://github.com/livekit/livekit-wakeword">
        <svg viewBox="0 0 24 24" aria-hidden="true" class="lk"><path fill="currentColor" d="M14.4 9.6H9.6v4.8h4.8zM19.2 4.8h-4.8v4.8h4.8zM19.2 14.4h-4.8v4.8h4.8zM24 0h-4.8v4.8H24zM24 19.2h-4.8V24H24zM4.8 19.2V0H0v24h14.4v-4.8z"/></svg>
        <span class="eyebrow">LiveKit Wakeword</span>
        <svg viewBox="0 0 45 44" aria-hidden="true" class="gh"><path fill="currentColor" fill-rule="evenodd" d="M22.48.93C10.49.93.76 10.65.76 22.65c0 9.6 6.22 17.74 14.85 20.6 1.09.2 1.49-.47 1.49-1.05l-.03-3.7c-6.04 1.32-7.32-2.91-7.32-2.91-.99-2.51-2.41-3.18-2.41-3.18-1.97-1.35.15-1.32.15-1.32 2.18.15 3.33 2.24 3.33 2.24 1.94 3.32 5.08 2.36 6.32 1.8.2-1.4.76-2.36 1.38-2.9-4.82-.55-9.9-2.41-9.9-10.73 0-2.37.85-4.31 2.24-5.83-.22-.55-.97-2.76.21-5.75 0 0 1.82-.58 5.97 2.23a20.8 20.8 0 0 1 10.88 0c4.14-2.81 5.96-2.23 5.96-2.23 1.19 2.99.44 5.2.22 5.75 1.39 1.52 2.23 3.46 2.23 5.83 0 8.34-5.08 10.18-9.92 10.72.78.67 1.47 2 1.47 4.02l-.03 5.96c0 .58.4 1.26 1.5 1.04 8.62-2.88 14.84-11.01 14.84-20.6C44.2 10.65 34.47.93 22.48.93"/></svg>
      </a>
      <h1 id="title">Say <em>“hey livekit”</em></h1>

      <div class="stage" id="stage">
        <canvas id="chart" aria-label="Live wake word scores"></canvas>
        <div class="drop eyebrow">Drop .onnx</div>
      </div>

      <div class="models" id="models">
        <label class="add" title="Load your own model">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M12.5 6v5.5H18v1h-5.5V18h-1v-5.5H6v-1h5.5V6z"/></svg>
          .onnx
          <input id="file" class="sr" type="file" accept=".onnx" multiple />
        </label>
      </div>
      <ol id="log" class="sr" aria-label="Detections" aria-live="polite"></ol>
    </main>

    <div class="controls">
      <button id="start" type="button" aria-label="Start listening" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 7a5 5 0 0 1 10 0v5a5 5 0 0 1-10 0z"/><path fill="currentColor" d="m5.25 13.87-.13-.49-.96.27.13.48a8.5 8.5 0 0 0 7.21 5.85V22h1v-2.02a8.5 8.5 0 0 0 7.21-5.85l.14-.48-.97-.27-.13.49A7.5 7.5 0 0 1 12 19a7.5 7.5 0 0 1-6.75-5.13"/></svg>
      </button>
      <div id="status" class="eyebrow" role="status">loading</div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
