<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LiveKit WakeWord</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f6f7;
        --fg: #111113;
        --muted: #6b6b73;
        --card: #ffffff;
        --line: #e3e3e6;
        --accent: #1f8cf9;
        --hit: #12b76a;
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0b0d;
          --fg: #ededf0;
          --muted: #8d8d96;
          --card: #151518;
          --line: #26262b;
        }
      }
      body { margin: 0; background: var(--bg); color: var(--fg); }
      main { max-width: 560px; margin: 0 auto; padding: 48px 16px; }
      h1 { font-size: 22px; margin: 0 0 4px; }
      p { color: var(--muted); margin: 0 0 24px; line-height: 1.5; }
      .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
      button {
        font: inherit; font-weight: 600; border: 0; border-radius: 8px; padding: 10px 18px;
        background: var(--accent); color: #fff; cursor: pointer;
      }
      button:disabled { opacity: 0.5; cursor: default; }
      .row { display: flex; align-items: center; gap: 12px; margin-top: 20px; }
      .label { font-size: 13px; color: var(--muted); min-width: 92px; font-variant-numeric: tabular-nums; }
      .meter { flex: 1; height: 10px; border-radius: 5px; background: var(--line); position: relative; overflow: hidden; }
      .meter > i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--accent); transition: width 80ms linear; }
      .meter > b { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--muted); }
      #status { margin-left: auto; font-size: 13px; color: var(--muted); }
      #log { list-style: none; padding: 0; margin: 20px 0 0; font-size: 14px; }
      #log li { padding: 8px 0; border-top: 1px solid var(--line); display: flex; justify-content: space-between; }
      #log li:first-child { color: var(--hit); font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>Say “hey livekit”</h1>
      <p>Detection runs in this tab with onnxruntime-web; no audio leaves the page.</p>
      <div class="card">
        <div class="row" style="margin-top: 0">
          <button id="start" type="button">Start listening</button>
          <span id="status">idle</span>
        </div>
        <div class="row">
          <span class="label" id="score">score 0.00</span>
          <div class="meter"><i id="bar"></i><b style="left: 50%"></b></div>
        </div>
        <ul id="log"></ul>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
