[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "livekit-wakeword"
version = "2.0.0"
description = "Run LiveKit wake word models: streaming detection from Python"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "LiveKit", email = "hello@livekit.io" }]
keywords = ["wake-word", "keyword-spotting", "voice", "speech", "livekit", "onnx"]
dependencies = [
    "numpy>=1.24",
    "onnxruntime>=1.17",
]

[project.optional-dependencies]
listener = ["pyaudio>=0.2.14"]

[tool.hatch.build.targets.wheel]
packages = ["src/livekit"]
